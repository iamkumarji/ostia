<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#f6f6f9;font-family:Helvetica,Arial,sans-serif;color:#16161f">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f6f9;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden">
        <tr><td style="background:#0c0c12;padding:24px 28px;color:#ffffff">
          <div style="font-size:14px;color:#ff8a63">{{ company }}</div>
          <div style="font-size:22px;font-weight:700;margin-top:4px">New website enquiry</div>
          <div style="font-size:13px;color:#c9c9d6;margin-top:6px">{{ submitted_at|date:"j F Y, H:i" }}</div>
        </td></tr>
        <tr><td style="padding:12px 28px 4px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            {% for label, value in rows %}
              <tr><td style="padding:14px 0;border-bottom:1px solid #e7e7ef">
                <div style="font-size:13px;font-weight:700;color:#56566b;margin-bottom:4px">{{ label }}</div>
                {% if value %}
                  <div style="font-size:15px;line-height:1.5;white-space:pre-wrap">{{ value }}</div>
                {% else %}
                  <div style="font-size:15px;color:#8d8da0">Not provided</div>
                {% endif %}
              </td></tr>
            {% endfor %}
          </table>
        </td></tr>
        {% if visitor_email %}
          <tr><td style="padding:20px 28px 28px">
            <a href="mailto:{{ visitor_email|urlencode }}?subject={{ 'Re: your enquiry'|urlencode }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:12px 22px;border-radius:999px">Reply{% if visitor_name %} to {{ visitor_name }}{% endif %}</a>
          </td></tr>
        {% endif %}
      </table>
    </td></tr>
  </table>
</body>
</html>
