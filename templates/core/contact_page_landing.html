{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
  <section class="section section--cream" style="min-height:52vh;display:grid;place-items:center;text-align:center">
    <div class="shell" style="max-width:640px">
      <div class="seal" style="margin:0 auto 24px;width:72px;height:72px;font-size:1.8rem" aria-hidden="true">&#10003;</div>
      <h1>Thank you</h1>
      <div class="prose" style="margin-inline:auto">{{ page.thank_you_text|richtext }}</div>
      <div class="btn-row" style="justify-content:center">
        <a class="btn btn--primary" href="/">Back to home <span class="btn__arrow" aria-hidden="true">&rarr;</span></a>
      </div>
    </div>
  </section>
{% endblock %}
